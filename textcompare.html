<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TextCompare · NexoKit</title><style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#151e32;--border:#2b3b58;--muted:#9db0ce;--accent:#65d6c1}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#172b42,var(--bg) 55%);font:15px system-ui,Segoe UI,sans-serif;color:#eef4ff}header{background:#101a2b;border-bottom:1px solid var(--border);padding:19px max(20px,calc((100vw - 1120px)/2));font-weight:800}header a{color:var(--accent);text-decoration:none}main{max-width:1160px;margin:auto;padding:30px 20px 65px}h1{margin:0 0 8px;font-size:34px}p{color:var(--muted);line-height:1.5}.panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px;margin:18px 0}.editors,.results{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-weight:700;margin-bottom:8px}textarea{width:100%;height:240px;resize:vertical;background:#0d1628;border:1px solid #3a4b68;color:#f1f6ff;border-radius:10px;padding:13px;font:13px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace}textarea:focus{outline:2px solid var(--accent)}button{background:#65d6c1;color:#082a2c;border:0;border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer}button.secondary{background:#263650;color:#eef4ff;border:1px solid #3a4b68}button:hover{filter:brightness(1.1)}.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:15px}.checks{display:flex;flex-wrap:wrap;gap:18px;margin:12px 0}.checks label{font-weight:500;margin:0}.summary{font-weight:650;color:#bcefe6;min-height:22px}.diffcol{min-width:0;overflow:auto;border:1px solid var(--border);border-radius:10px;background:#0c1424}.diffhead{position:sticky;top:0;background:#1d2b43;padding:10px;font-weight:750}.line{display:flex;min-height:26px;font:12px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;border-top:1px solid #ffffff09}.num{flex:0 0 42px;text-align:right;padding:3px 8px;color:#8499b8;border-right:1px solid #ffffff14;user-select:none}.content{white-space:pre-wrap;overflow-wrap:anywhere;padding:3px 9px;flex:1;min-width:0}.del{background:#49242d}.add{background:#183e37}.changed{background:#3a3320}.empty{background:#141b2a;color:#627089}.markdel{background:#a84355;border-radius:2px}.markadd{background:#267e65;border-radius:2px}.legend{font-size:13px;color:var(--muted)}.legend span{padding:3px 7px;border-radius:5px;margin-right:8px}.status{font-size:13px;color:var(--muted)}@media(max-width:700px){.editors,.results{grid-template-columns:1fr}textarea{height:180px}main{padding:24px 12px}}
</style></head><body><header><a href="index.html">▦ NexoKit</a> / TextCompare</header><main><h1>TextCompare</h1><p>Compara dos versiones de un texto o código. Detecta líneas añadidas, eliminadas y cambios dentro de las líneas. Todo funciona sin conexión.</p><section class="panel"><div class="editors"><div><label for="left">Texto original</label><textarea id="left" spellcheck="false" placeholder="Pega aquí la versión original..."></textarea></div><div><label for="right">Texto nuevo</label><textarea id="right" spellcheck="false" placeholder="Pega aquí la versión nueva..."></textarea></div></div><div class="checks"><label><input id="spaces" type="checkbox"> Ignorar espacios repetidos y extremos</label><label><input id="case" type="checkbox"> Ignorar mayúsculas/minúsculas</label><label><input id="words" type="checkbox" checked> Resaltar cambios de palabras</label></div><div class="actions"><button id="compare">Comparar textos</button><button class="secondary" id="swap">Intercambiar</button><button class="secondary" id="example">Cargar ejemplo</button><button class="secondary" id="clear">Limpiar</button><button class="secondary" id="copy">Copiar informe</button><button class="secondary" id="download">Descargar informe TXT</button></div><p id="status" class="status" role="status"></p></section><section class="panel"><h2>Resultado</h2><p class="summary" id="summary">Introduce dos textos y pulsa «Comparar textos».</p><p class="legend"><span class="del">Eliminado</span><span class="add">Añadido</span><span class="changed">Modificado</span></p><div class="results"><div class="diffcol"><div class="diffhead">Original</div><div id="outleft"></div></div><div class="diffcol"><div class="diffhead">Nuevo</div><div id="outright"></div></div></div></section></main><script>
'use strict';const $=id=>document.getElementById(id);let report='';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function norm(s){if($('spaces').checked)s=s.trim().replace(/\s+/g,' ');if($('case').checked)s=s.toLocaleLowerCase();return s}
// Dynamic programming for modest inputs, greedy fallback for very large comparisons.
function diff(a,b){const n=a.length,m=b.length;if(n*m>1600000){let i=0,j=0,out=[];while(i<n||j<m){if(i<n&&j<m&&a[i]===b[j]){out.push(['=',a[i++]]);j++}else if(i<n&&(!b.slice(j,j+25).includes(a[i])||j>=m))out.push(['-',a[i++]]);else if(j<m)out.push(['+',b[j++]]);else out.push(['-',a[i++]])}return out}let dp=Array.from({length:n+1},()=>new Uint32Array(m+1));for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);let i=0,j=0,out=[];while(i<n||j<m){if(i<n&&j<m&&a[i]===b[j]){out.push(['=',a[i++]]);j++}else if(i<n&&(j===m||dp[i+1][j]>=dp[i][j+1]))out.push(['-',a[i++]]);else out.push(['+',b[j++]])}return out}
function wordMarkup(a,b){let at=a.match(/\s+|\S+/g)||[],bt=b.match(/\s+|\S+/g)||[];if(at.length*bt.length>50000)return [esc(a),esc(b)];let steps=diff(at.map(norm),bt.map(norm));let i=0,j=0,la='',lb='';for(const [op] of steps){if(op==='='){la+=esc(at[i++]);lb+=esc(bt[j++])}else if(op==='-')la+='<span class="markdel">'+esc(at[i++])+'</span>';else lb+='<span class="markadd">'+esc(bt[j++])+'</span>'}return [la,lb]}
function renderLine(no,content,kind,html){return '<div class="line '+kind+'"><span class="num">'+(no||'')+'</span><span class="content">'+(html===undefined?esc(content):html||'&nbsp;')+'</span></div>'}
function compare(){const l=$('left').value.replace(/\r\n?/g,'\n'),r=$('right').value.replace(/\r\n?/g,'\n');let a=l===''?[]:l.split('\n'),b=r===''?[]:r.split('\n');let steps=diff(a.map(norm),b.map(norm));let li=0,ri=0,added=0,removed=0,modified=0,unchanged=0,htmlL='',htmlR='',reportLines=[];for(let k=0;k<steps.length;){if(steps[k][0]==='='){li++;ri++;unchanged++;htmlL+=renderLine(li,a[li-1],'');htmlR+=renderLine(ri,b[ri-1],'');reportLines.push('  '+a[li-1]);k++;continue}let dels=[],adds=[];while(k<steps.length&&steps[k][0]!=='='){if(steps[k][0]==='-')dels.push(a[li++]);else adds.push(b[ri++]);k++}let pairs=Math.min(dels.length,adds.length);for(let x=0;x<Math.max(dels.length,adds.length);x++){let d=dels[x],ad=adds[x],dn=d===undefined?'':li-dels.length+x+1,an=ad===undefined?'':ri-adds.length+x+1;if(x<pairs){modified++;let [dl,ar]=$('words').checked?wordMarkup(d,ad):[esc(d),esc(ad)];htmlL+=renderLine(dn,d,'changed',dl);htmlR+=renderLine(an,ad,'changed',ar);reportLines.push('~ '+d+'\n> '+ad)}else if(d!==undefined){removed++;htmlL+=renderLine(dn,d,'del');htmlR+=renderLine('','','empty');reportLines.push('- '+d)}else{added++;htmlL+=renderLine('','','empty');htmlR+=renderLine(an,ad,'add');reportLines.push('+ '+ad)}}} $('outleft').innerHTML=htmlL||renderLine('','Sin contenido','empty');$('outright').innerHTML=htmlR||renderLine('','Sin contenido','empty');$('summary').textContent=`${modified} líneas modificadas · ${added} añadidas · ${removed} eliminadas · ${unchanged} sin cambios`;report='TextCompare · Informe de diferencias\n'+$('summary').textContent+'\n\n'+reportLines.join('\n');$('status').textContent='Comparación terminada.'}
$('compare').onclick=compare;$('swap').onclick=()=>{let t=$('left').value;$('left').value=$('right').value;$('right').value=t;compare()};$('example').onclick=()=>{$('left').value='Proyecto NexoKit\nVersión 1\nIncluye herramientas para documentos.\nExportar a PNG.\nFin';$('right').value='Proyecto NexoKit\nVersión 2\nIncluye herramientas para documentos y PDF.\nExportar a PNG y SVG.\nNueva función: comparar textos.\nFin';compare()};$('clear').onclick=()=>{$('left').value='';$('right').value='';report='';$('outleft').innerHTML='';$('outright').innerHTML='';$('summary').textContent='Introduce dos textos y pulsa «Comparar textos».';$('status').textContent=''};['spaces','case','words'].forEach(id=>$(id).onchange=()=>{if(report)compare()});$('copy').onclick=async()=>{if(!report){$('status').textContent='Primero realiza una comparación.';return}try{await navigator.clipboard.writeText(report);$('status').textContent='Informe copiado.'}catch(e){let t=document.createElement('textarea');t.value=report;document.body.appendChild(t);t.select();let ok=document.execCommand('copy');t.remove();$('status').textContent=ok?'Informe copiado.':'No se pudo copiar; utiliza la descarga TXT.'}};$('download').onclick=()=>{if(!report){$('status').textContent='Primero realiza una comparación.';return}let u=URL.createObjectURL(new Blob([report],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='textcompare_informe.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
</script></body></html>
