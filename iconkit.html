:root{color-scheme:dark;--bg:#0b1020;--panel:#151e32;--border:#2b3b58;--muted:#9db0ce;--accent:#65d6c1}*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#eef4ff;font:14px system-ui,Segoe UI,sans-serif}header{padding:14px 24px;background:#101a2b;border-bottom:1px solid var(--border);font-weight:750}a{color:var(--accent);text-decoration:none}main{max-width:1480px;margin:auto;padding:18px 22px}h1{font-size:24px;margin:0 0 4px}p{color:var(--muted);margin:0 0 14px}.layout{display:grid;grid-template-columns:minmax(340px,1fr) 320px;gap:16px;align-items:start}.panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}input,select,button{font:inherit;border-radius:8px;border:1px solid #344760;background:#0d1728;color:#eef4ff;padding:9px}input[type=search]{flex:1;min-width:160px}button{cursor:pointer}button:hover{border-color:var(--accent)}button.primary{background:#176c66;border-color:#318b81;font-weight:700}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent)}.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:7px;max-height:calc(100vh - 235px);min-height:240px;overflow:auto;padding:3px}.tile{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 5px;min-height:84px}.tile svg{width:29px;height:29px}.tile span{font-size:11px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tile.active{background:#214d50;border-color:var(--accent)}.preview{height:225px;display:grid;place-items:center;overflow:hidden;border:1px dashed #39536d;border-radius:12px;background:#0e1727;margin:12px 0}.preview svg{width:min(85%,190px)!important;height:min(85%,190px)!important;max-width:100%;max-height:100%;display:block;flex-shrink:0}.field{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:11px 0}.field label{color:#c8d7ed}.field input[type=range]{width:145px}.field select{width:155px}.field input[type=color]{padding:2px;width:60px;height:35px}.field input[type=number]{width:88px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}.actions button{padding:11px 5px}.note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5}.status{color:var(--accent);min-height:20px;margin-top:8px;font-size:12px}@media(max-width:780px){.layout{grid-template-columns:1fr}.icons{max-height:330px}.preview{height:190px}main{padding:14px}header{padding:12px 14px}}
</style></head><body><header><a href="index.html">NexoKit</a> / IconKit</header><main><h1>IconKit</h1><p>Busca, personaliza y exporta iconos. Funciona sin Internet.</p><div class="layout"><section class="panel"><div class="tools"><input id="search" type="search" placeholder="Buscar iconos…" aria-label="Buscar iconos"><select id="category" aria-label="Categoría"><option value="">Todas las categorías</option></select></div><div id="count" class="note" style="margin:0 0 8px"></div><div class="icons" id="icons"></div></section><section class="panel"><strong id="selectedName">Icono</strong><div class="preview" id="preview"></div><div class="field"><label for="color">Color del icono</label><input id="color" type="color" value="#65d6c1"></div><div class="field"><label for="bg">Fondo</label><select id="bg"><option value="none">Transparente</option><option value="circle">Circular</option><option value="square">Cuadrado</option><option value="rounded">Redondeado</option></select></div><div class="field"><label for="bgcolor">Color del fondo</label><input id="bgcolor" type="color" value="#203d50"></div><div class="field"><label for="size">Tamaño (px)</label><input id="size" type="number" min="32" max="1024" step="8" value="256"></div><div class="field"><label for="stroke">Grosor <span id="strokeVal">2</span></label><input id="stroke" type="range" min="1" max="4" step="0.25" value="2"></div><div class="actions"><button class="primary" id="svg">Descargar SVG</button><button class="primary" id="png">Descargar PNG</button><button id="copy">Copiar código SVG</button><button id="copyPng">Copiar imagen PNG</button></div><div class="status" id="status" role="status"></div><div class="note">Los iconos están incluidos en este HTML. Puedes utilizarlos en tus documentos y diagramas sin subir imágenes a ningún servidor. La copia PNG puede depender de los permisos del navegador.</div></section></div></main><script>

const items=raw.map(([name,category,parts])=>({name,category,parts:parts.split('|').map(part=>{const m=part.match(/^(path|rect|circle|line|polyline|polygon|ellipse)\s+(.+)$/);return m?`<${m[1]} ${m[2]}/>`:''}).join('')}));
const $=id=>document.getElementById(id);let current=items[0];
const cats=[...new Set(items.map(x=>x.category))];cats.forEach(c=>{let o=document.createElement('option');o.value=c;o.textContent=c;$('category').append(o)});
function iconSvg(item,sz=24){const size=Math.max(32,Math.min(1024,Number($('size').value)||256));const w=Number($('stroke').value);const bg=$('bg').value;const color=$('color').value;const fill=$('bgcolor').value;let shape='';if(bg==='circle')shape=`<circle cx="12" cy="12" r="12" fill="${fill}"/>`;if(bg==='square')shape=`<rect width="24" height="24" fill="${fill}"/>`;if(bg==='rounded')shape=`<rect width="24" height="24" rx="5" fill="${fill}"/>`;let scale=bg==='none'?1:.72;let transform=bg==='none'?'':'transform="translate(12 12) scale(.72) translate(-12 -12)"';return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${shape}<g ${transform}>${item.parts}</g></svg>`}
function update(){const svg=iconSvg(current);$('preview').innerHTML=svg;$('selectedName').textContent=current.name;$('strokeVal').textContent=$('stroke').value;$('bgcolor').disabled=$('bg').value==='none'}
function render(){const q=$('search').value.trim().toLocaleLowerCase('es');const cat=$('category').value;const found=items.filter(x=>(!cat||x.category===cat)&&(!q||(x.name+' '+x.category).toLocaleLowerCase('es').includes(q)));$('count').textContent=`${found.length} iconos encontrados · ${items.length} disponibles`;$('icons').replaceChildren();found.forEach(item=>{const b=document.createElement('button');b.className='tile'+(item===current?' active':'');b.title=item.name;b.innerHTML=iconSvg(item)+`<span></span>`;b.querySelector('span').textContent=item.name;b.onclick=()=>{current=item;render();update()};$('icons').append(b)});}
function status(t){$('status').textContent=t}
function download(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
const filename=()=>current.name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-');
function svgBlob(){return new Blob([iconSvg(current)],{type:'image/svg+xml;charset=utf-8'})}
async function pngBlob(){const svg=iconSvg(current);const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}));try{const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});const s=Math.max(32,Math.min(1024,Number($('size').value)||256));const canvas=document.createElement('canvas');canvas.width=canvas.height=s;canvas.getContext('2d').drawImage(img,0,0,s,s);return await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error('No se pudo crear el PNG')),'image/png'))}finally{URL.revokeObjectURL(url)}}
$('svg').onclick=()=>{download(svgBlob(),filename()+'.svg');status('SVG descargado')};$('png').onclick=async()=>{try{download(await pngBlob(),filename()+'.png');status('PNG descargado')}catch(e){status('No se pudo exportar el PNG: '+e.message)}};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(iconSvg(current));status('Código SVG copiado')}catch(e){status('El navegador no permite copiar SVG aquí; puedes descargarlo')}};
$('copyPng').onclick=async()=>{try{if(!navigator.clipboard?.write||!window.ClipboardItem)throw Error('Portapapeles no disponible');await navigator.clipboard.write([new ClipboardItem({'image/png':await pngBlob()})]);status('PNG copiado')}catch(e){status('No se puede copiar PNG en este navegador; usa Descargar PNG')}};
['search','category'].forEach(id=>$(id).addEventListener('input',render));['color','bg','bgcolor','size','stroke'].forEach(id=>$(id).addEventListener('input',()=>{update();render()}));render();update();
